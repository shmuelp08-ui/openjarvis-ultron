version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust"
    # Pre-1.0 Rig upgrades change its model/agent APIs and need a migration.
    ignore:
      - dependency-name: "rig-core"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    # These optional extras currently have incompatible upstream version ranges:
    # vLLM conflicts with FastAPI/NumPy/Transformers during cross-platform lock updates.
    # Keep updating the rest of the Python dependency set.
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "numpy"
      - dependency-name: "transformers"
      - dependency-name: "vllm"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
