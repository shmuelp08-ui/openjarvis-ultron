name: Assemble ULTRON from OpenJarvis and the original Android app

on:
  push:
    paths:
      - ".github/workflows/import-openjarvis.yml"
  workflow_dispatch:

concurrency:
  group: ultron-upstream-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ULTRON
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out upstream OpenJarvis
        uses: actions/checkout@v4
        with:
          repository: open-jarvis/OpenJarvis
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Check out the original ULTRON Android project
        uses: actions/checkout@v4
        with:
          repository: shmuelp08-ui/Ultron
          ref: main
          path: ultron-android-source
          fetch-depth: 1

      - name: Assemble the real source trees
        shell: bash
        run: |
          set -euo pipefail

          git -C upstream rev-parse HEAD > UPSTREAM_COMMIT
          git -C ultron-android-source rev-parse HEAD > ULTRON_ANDROID_COMMIT

          # Import the complete OpenJarvis source, retaining its license and notices.
          rsync -a --exclude='.git' --exclude='.github/workflows/**' upstream/ ./

          # Put the existing native Android app in its own project directory.
          mkdir -p android
          rsync -a --exclude='.git' ultron-android-source/ android/

          # Remove the earlier experimental API scaffold. The Android app and
          # OpenJarvis framework are the actual two source projects.
          rm -rf ultron_server

          # Remove this one-time importer after the assembly is complete.
          rm -f .github/workflows/import-openjarvis.yml

          cat > README.md <<'EOF'
          # ULTRON

          ULTRON combines the OpenJarvis assistant framework with the original ULTRON Android application.

          ## Source layout

          - `android/` — the original native Android/Kotlin ULTRON app, copied from the separate ULTRON Android repository.
          - `src/openjarvis/` — the actual OpenJarvis Python framework and its agent, memory, tool, and provider systems.
          - `rust/` — the upstream Rust components.
          - `frontend/` and `desktop/` — upstream frontend and desktop application source.

          ## Provenance

          - `UPSTREAM_COMMIT` records the exact OpenJarvis revision imported.
          - `ULTRON_ANDROID_COMMIT` records the exact original Android app revision copied into `android/`.
          - OpenJarvis license and attribution files are retained. The original Android repository remains separate and unchanged.

          ## Important

          Importing source code does not by itself prove that every feature builds or works on a device. Android and framework integration still needs to be built, tested, and wired together.
          EOF

          # Keep upstream module/import names intact; only the distribution name,
          # public CLI command, and repository metadata are rebranded.
          python - <<'PY'
          from pathlib import Path
          p = Path("pyproject.toml")
          s = p.read_text()
          for line in (
              '    "fastapi>=0.110",\n',
              '    "google-genai>=1.0",\n',
              '    "groq>=0.9",\n',
              '    "uvicorn[standard]>=0.30",\n',
              '    "python-dotenv>=1.0",\n',
          ):
              s = s.replace(line, "", 1)
          s = s.replace(
              'Issues = "https://github.com/open-jarvis/OpenJarvis/issues"',
              'Issues = "https://github.com/shmuelp08-ui/openjarvis-ultron/issues"',
          )
          p.write_text(s)
          PY

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Combine OpenJarvis framework with original ULTRON Android app"
          git push
